name: generate profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # all repos are private, so a PAT (scopes: repo, read:user) is required
      - name: check token
        env:
          PAT: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Secret PROFILE_STATS_TOKEN belum diisi (butuh scope repo + read:user)"
            exit 1
          fi

      - name: top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=kazancocytus&layout=compact&theme=github_dark&hide_border=true&langs_count=8
          path: dist/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=kazancocytus&theme=github_dark&show_icons=true&hide_border=true&count_private=true
          path: dist/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: push cards to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-cards
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
